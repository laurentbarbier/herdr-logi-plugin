name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Herdr.slnx
      - run: dotnet build Herdr.slnx -c Release
      - run: dotnet tool install --global LogiPluginTool --version 6.4.2.3599
      - run: logiplugintool pack build/Release Herdr.lplug4
      - run: logiplugintool verify Herdr.lplug4
      - uses: actions/upload-artifact@v4
        with:
          name: Herdr-lplug4
          path: '*.lplug4'
